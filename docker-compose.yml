version: '3.7'

services:
  wordpress:
    image: wordpress:latest
    container_name: wordpress
    restart: always
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: example
    volumes:
      - wordpress_data:/var/www/html
      - ./wordpress/wp-content:/var/www/html/wp-content
    depends_on:
      - db
    networks:
      - custom_ai_ollama_network

  db:
    image: mysql:5.7
    container_name: db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: wordpress
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - custom_ai_ollama_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    platform: "linux/amd64"
    container_name: phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: example
    depends_on:
      - db
    networks:
      - custom_ai_ollama_network

      # Automatisches Downloaden von Models (llama3:8b)
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "8090:11434"  # Ollama API auf Port 5000
    volumes:
      - ollama_data:/data
    networks:
      - custom_ai_ollama_network

volumes:
  wordpress_data:
  db_data:
  ollama_data:

networks:
  custom_ai_ollama_network:
    driver: bridge

